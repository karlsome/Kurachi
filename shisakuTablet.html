<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="src/favicon2.png">
    <title>Prototype Tablet - Shisaku</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;0,6..12,800;0,6..12,900&display=swap" rel="stylesheet">
    <style>
        /* DESIGN SYSTEM - Flat / Dashboard-UI-Kit inspired from DCP interactive */
        :root {
            --bg-app: #F4F6FA;
            --bg-surface: #FFFFFF;
            --bg-subtle: #F7F8FB;
            --bg-inset: #EEF1F6;
            --border: #E6E8EF;
            --border-strong: #D6DAE3;
            --text-main: #1F2733;
            --text-muted: #6B7280;
            --text-soft: #9AA1AC;

            --brand: #1F9D6B;
            --brand-hover: #178A5C;
            --brand-soft: #E7F5EF;
            --blue: #2E6FF2;
            --blue-hover: #1F5DD8;
            --blue-soft: #E8F0FE;
            --red: #E5484D;
            --red-hover: #CE3B40;
            --red-soft: #FCEBEC;
            --amber: #E0900E;
            --amber-soft: #FBF0DC;
            --orange: #FF9800;
            --orange-soft: #FFF3E0;

            --card-radius: 12px;
            --btn-radius: 8px;
            --r-pill: 6px;
            --shadow-card: 0 1px 2px rgba(16, 24, 40, 0.04);
            --shadow-pop: 0 12px 32px rgba(16, 24, 40, 0.14);
            --transition-smooth: 0.18s ease;
            --header-height: 64px;
            --tab-bar-height: 66px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Nunito Sans', sans-serif;
            background-color: var(--bg-app);
            color: var(--text-main);
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Header */
        header {
            height: var(--header-height);
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: relative;
            flex-shrink: 0;
            z-index: 1000;
        }

        .freya-center-mark {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.625rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            color: var(--text-soft);
            text-transform: uppercase;
            pointer-events: none;
            white-space: nowrap;
            user-select: none;
        }

        .header-title-section { display: flex; align-items: center; gap: 12px; }
        .header-title-section h1 { font-size: 1.125rem; font-weight: 800; color: var(--text-main); }
        .status-tag {
            background: var(--bg-inset);
            border: 1px solid var(--border);
            padding: 5px 10px;
            border-radius: var(--r-pill);
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 700;
            white-space: nowrap;
        }

        .header-action-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .language-selector select {
            min-height: 40px;
            padding: 8px 12px;
            background: var(--bg-surface);
            border: 1px solid var(--border-strong);
            border-radius: var(--btn-radius);
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            transition: border-color var(--transition-smooth);
        }

        .language-selector select:hover {
            border-color: var(--blue);
        }

        .btn-sidebar-toggle {
            background: var(--bg-surface);
            border: 1px solid var(--border-strong);
            color: var(--text-muted);
            width: 40px;
            height: 40px;
            border-radius: var(--btn-radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: 800;
            font-style: italic;
            cursor: pointer;
            transition: var(--transition-smooth);
            flex-shrink: 0;
        }

        /* Tab Navigation (Top style for main tabs) */
        .tab-bar {
            height: var(--tab-bar-height);
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            position: relative;
            z-index: 999;
            flex-shrink: 0;
        }
        .tab-btn {
            flex: 1;
            min-width: 0;
            background: transparent;
            border: none;
            color: var(--text-soft);
            font-family: inherit;
            font-size: 0.8125rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: color var(--transition-smooth), opacity var(--transition-smooth);
            position: relative;
            border-bottom: 3px solid transparent;
        }
        .tab-btn:hover:not(.locked) {
            color: var(--text-main);
        }
        .tab-btn.active {
            color: var(--brand);
            border-bottom: 3px solid var(--brand);
        }
        .tab-btn.locked {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .tab-btn.locked .tab-icon::after {
            content: '🔒';
            font-size: 9px;
            position: absolute;
            top: 2px;
            right: 50%;
            transform: translateX(14px);
        }
        .tab-btn .tab-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 24px;
        }
        .tab-btn .tab-icon svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            stroke-width: 1.8;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Viewport and Panels */
        .tab-content-viewport {
            flex: 1;
            width: 100%;
            overflow: hidden;
            position: relative;
            background: var(--bg-app);
        }
        .tab-panels-container {
            display: flex;
            width: 500%; /* 5 tabs */
            height: 100%;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform;
        }
        .tab-panel {
            width: 20%; /* 100% / 5 tabs */
            height: 100%;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 20px;
        }

        /* Sub-Tabs (for Prototype Status) */
        .sub-tab-bar {
            display: flex;
            background: var(--bg-surface);
            border-radius: var(--btn-radius);
            border: 1px solid var(--border);
            padding: 4px;
            margin-bottom: 20px;
        }
        .sub-tab-btn {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: none;
            border-radius: calc(var(--btn-radius) - 2px);
            font-weight: 700;
            font-size: 0.875rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition-smooth);
        }
        .sub-tab-btn.active {
            background: var(--blue-soft);
            color: var(--blue);
        }

        /* Lists and Cards */
        .grid-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 16px;
        }
        .card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--card-radius);
            padding: 16px;
            box-shadow: var(--shadow-card);
            cursor: pointer;
            transition: transform var(--transition-smooth);
        }
        .card:active {
            transform: scale(0.98);
        }
        .card h3 { font-size: 1.1rem; font-weight: 800; margin-bottom: 4px; color: var(--text-main); }
        .card p { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; margin-bottom: 8px; }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: var(--r-pill);
            font-size: 0.75rem;
            font-weight: 800;
        }
        .badge.pending { background: var(--orange-soft); color: var(--orange); }
        .badge.in-progress { background: var(--blue-soft); color: var(--blue); }
        .badge.completed { background: var(--brand-soft); color: var(--brand); }
        .badge.canceled { background: var(--red-soft); color: var(--red); }

        /* Request Drilldown Views inside Request Tab */
        .view-section { display: none; }
        .view-section.active { display: block; }
        
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: transparent;
            border: 1px solid var(--border-strong);
            padding: 8px 14px;
            border-radius: var(--btn-radius);
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            margin-bottom: 20px;
        }

        /* Request Rows */
        .request-row {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--card-radius);
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            box-shadow: var(--shadow-card);
        }
        .request-row:active { transform: scale(0.99); }
        .request-row .row-number {
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--blue);
            width: 40px;
        }
        .request-row .row-info {
            flex: 1;
            font-size: 0.95rem;
            font-weight: 700;
        }

        /* Request Details */
        .details-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--card-radius);
            padding: 20px;
            box-shadow: var(--shadow-card);
        }
        .details-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 20px;
        }
        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .detail-item label { font-size: 0.8rem; color: var(--text-muted); font-weight: 700; }
        .detail-item span { font-size: 1rem; font-weight: 800; color: var(--text-main); }
        
        .details-image {
            width: 100%;
            height: 300px;
            object-fit: contain;
            background: var(--bg-subtle);
            border: 1px solid var(--border);
            border-radius: var(--card-radius);
            margin-bottom: 20px;
        }

        /* Buttons */
        .btn {
            padding: 16px;
            border: none;
            border-radius: var(--btn-radius);
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            transition: background var(--transition-smooth), transform 0.1s;
        }
        .btn:active { transform: scale(0.98); }
        .btn-send {
            width: 100%;
            background: var(--brand);
            color: white;
        }
        .btn-send:hover { background: var(--brand-hover); }

        /* User Tab Specifics */
        .user-setup-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--card-radius);
            padding: 24px;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            box-sizing: border-box;
            box-shadow: var(--shadow-card);
        }
        .user-setup-card h2 {
            margin-bottom: 20px;
            font-size: 1.25rem;
            font-weight: 800;
            text-align: center;
        }

        /* Input styling exactly matching DCP */
        .tap-field {
            width: 100%;
            padding: 14px 16px;
            font-size: 1.1rem;
            border: 1px solid var(--border-strong);
            border-radius: var(--btn-radius);
            background: var(--bg-subtle);
            color: var(--text-main);
            margin-bottom: 15px;
            cursor: pointer;
        }
        .tap-field:focus {
            outline: none;
            border-color: var(--brand);
            background: var(--bg-surface);
            box-shadow: 0 0 0 4px var(--brand-soft);
        }

        .btn-secondary {
            background: var(--bg-surface);
            border-color: var(--border-strong);
            color: var(--text-main);
        }
        .btn-secondary:hover {
            background: var(--bg-subtle);
            border-color: var(--text-soft);
        }
        .btn-alert {
            background: var(--red);
            color: #FFFFFF;
            border: none;
        }
        .btn-alert:hover {
            background: var(--red-hover);
        }
        .btn-full {
            width: 100%;
            padding: 14px;
            min-height: 44px;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        /* Modals */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(16, 24, 40, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 10000;
        }
        /* Override display:block from JS to display:flex for centering */
        .modal[style*="display: block"],
        .modal[style*="display:block"] {
            display: flex !important;
        }

        .modal-content,
        #workerNameModal>div {
            background: var(--bg-surface) !important;
            border: 1px solid var(--border) !important;
            border-radius: var(--card-radius) !important;
            padding: 24px !important;
            color: var(--text-main) !important;
            box-shadow: var(--shadow-pop) !important;
            box-sizing: border-box;
            max-width: calc(100vw - 40px);
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            margin: auto;
            width: 100%;
        }

        #workerNameModal>div {
            max-width: 580px;
            max-height: 86vh;
            display: flex;
            flex-direction: column;
        }

        #workerNameModal h2 {
            font-size: 1.25rem;
            font-weight: 800;
        }

        #workerNameModal .worker-section {
            margin-bottom: 18px;
        }

        #workerNameModal .worker-section-header {
            background: var(--blue) !important;
            color: #FFFFFF !important;
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.03em;
            padding: 6px 14px;
            border-radius: 999px;
            display: inline-block;
            margin-bottom: 12px;
        }

        #workerNameModal .worker-names-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        #workerNameModal .worker-name-btn {
            background: var(--bg-surface) !important;
            border: 1px solid var(--border-strong) !important;
            color: var(--text-main) !important;
            border-radius: var(--btn-radius) !important;
            transition: var(--transition-smooth) !important;
            width: 100%;
            min-height: 58px;
            padding: 12px 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        #workerNameModal .worker-name-btn:hover {
            background: var(--bg-subtle) !important;
            border-color: var(--blue) !important;
        }
        
        #workerNameModal .worker-name-btn:active {
            transform: scale(0.97);
        }

        #workerNameModal .recent-section .worker-name-btn {
            background: var(--amber-soft) !important;
            border-color: #EAD2A0 !important;
            color: #8A5A00 !important;
        }

        #workerNameModal .recent-section .worker-section-header {
            background: var(--amber) !important;
        }

        #workerNameModal .recent-section [style*="position: relative"],
        #workerNameModal .recent-section .worker-name-btn {
            position: relative;
        }

        #workerNameModal .delete-recent-btn {
            position: absolute;
            top: -7px;
            right: -7px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: var(--red);
            color: #fff;
            border: 2px solid var(--bg-surface);
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            padding: 0;
        }

        /* Welcome Back Layout */
        #welcomeBackContainer { display: none; }
        #welcomeBackContainer.active { display: flex; flex-direction: column; align-items: center; gap: 15px; }
        #newWorkerContainer { display: none; flex-direction: column; align-items: center; gap: 15px; }
        #newWorkerContainer.active { display: flex; }

        .flash-overlay {
            position: fixed;
            inset: 0;
            background: var(--brand);
            opacity: 0;
            pointer-events: none;
            z-index: 100000;
            transition: opacity 0.3s;
        }
        .flash-overlay.show {
            opacity: 0.5;
        }

        /* Image preview modal */
        .img-preview-modal {
            position: fixed;
            inset: 0;
            z-index: 100150;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(16, 24, 40, 0.82);
            padding: 20px;
        }

        .img-preview-modal.open {
            display: flex;
        }

        .img-preview-modal img {
            max-width: 96vw;
            max-height: 82vh;
            border-radius: var(--card-radius);
            box-shadow: var(--shadow-pop);
        }

        .img-preview-modal .img-preview-close {
            position: absolute;
            top: 18px;
            right: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.16);
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header>
        <div class="header-title-section">
            <h1>試作 Prototype</h1>
            <span class="status-tag" id="machineNameTag">設備: -</span>
        </div>
        <span class="freya-center-mark">Freya System v4</span>
        <div class="header-action-section">
            <div class="language-selector">
                <select id="languageSelector">
                    <option value="ja">日本語</option>
                    <option value="en">English</option>
                </select>
            </div>
            <button type="button" class="btn-sidebar-toggle">i</button>
        </div>
    </header>

    <!-- Main Tab Bar (Top) -->
    <div class="tab-bar" id="mainTabBar">
        <button type="button" class="tab-btn active" data-tab="0">
            <span class="tab-icon">
                <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
            <span class="tab-label">User</span>
        </button>
        <button type="button" class="tab-btn locked" data-tab="1">
            <span class="tab-icon">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
            </span>
            <span class="tab-label">Prototype</span>
        </button>
        <button type="button" class="tab-btn locked" data-tab="2">
            <span class="tab-icon">
                <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            </span>
            <span class="tab-label">Request</span>
        </button>
        <button type="button" class="tab-btn locked" data-tab="3">
            <span class="tab-icon">
                <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.6"/><polyline points="4 17 9 12 13 16 16.5 12.5 20 16"/></svg>
            </span>
            <span class="tab-label">Images</span>
        </button>
        <button type="button" class="tab-btn locked" data-tab="4">
            <span class="tab-icon">
                <svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            </span>
            <span class="tab-label">Submit</span>
        </button>
    </div>

    <!-- Main Viewport -->
    <div class="tab-content-viewport">
        <div class="tab-panels-container" id="tabPanelsContainer">
            
            <!-- Panel 0: User -->
            <div class="tab-panel" style="display: flex; flex-direction: column;">
                <div class="user-setup-card">
                    
                    <!-- State B: Confirm Existing Worker -->
                    <div id="welcomeBackContainer">
                        <h2 style="color: var(--brand);">Worker Setup</h2>
                        <p style="font-size: 1.1rem; color: var(--text-main); margin: 0; text-align: center; line-height: 1.5;">
                            Are you still<br>
                            <strong id="confirmUserName" style="color: var(--brand); font-size: 1.4rem; display: block; margin: 8px 0;"></strong>
                            ?
                        </p>
                        <div style="display: flex; gap: 10px; width: 100%; margin-top: 10px;">
                            <button type="button" class="btn" style="flex: 1; background: var(--bg-surface); border: 1px solid var(--border-strong);" onclick="changeWorkerName()">Change</button>
                            <button type="button" class="btn" style="flex: 2; background: var(--brand); color: white;" onclick="confirmWorkerName()">Yes</button>
                        </div>
                    </div>

                    <!-- State A: Select New Worker -->
                    <div id="newWorkerContainer">
                        <h2>Worker Setup</h2>
                        <div style="width: 100%;">
                            <input list="machine-operator-suggestions" class="tap-field"
                                id="workerInput" name="workerInput"
                                placeholder="Select Worker..." required readonly>
                            <datalist id="machine-operator-suggestions"></datalist>
                        </div>
                        <button type="button" class="btn btn-send" onclick="proceedFromStep0()" style="margin-top: 10px;">
                            Next
                        </button>
                    </div>

                </div>
                
                <div style="margin-top: auto; text-align: center; padding: 20px 0 0 0;">
                    <button type="button" class="btn" onclick="resetAll()" style="width: 100%; max-width: 400px; padding: 14px; background: var(--red); color: white; border: none; font-size: 1.1rem;">
                        Reset All
                    </button>
                </div>
            </div>

            <!-- Panel 1: Prototype -->
            <div class="tab-panel">
                <!-- Level 1: Prototype List -->
                <div id="view-prototype-list" class="view-section active">
                    <div class="sub-tab-bar" id="statusTabs">
                        <button class="sub-tab-btn active" data-status="pending">Pending</button>
                        <button class="sub-tab-btn" data-status="in-progress">In-Progress</button>
                        <button class="sub-tab-btn" data-status="completed">Completed</button>
                        <button class="sub-tab-btn" data-status="canceled">Canceled</button>
                    </div>
                    <div class="grid-list" id="prototypesGrid">
                        <!-- Prototype cards injected here -->
                    </div>
                </div>

                <!-- Level 2: Prototype Detailed Info -->
                <div id="view-prototype-details" class="view-section">
                    <button class="back-btn" onclick="showPrototypeView('list')">← Back to List</button>
                    <div class="details-card">
                        <h2 id="protoPreviewTitle" style="margin-bottom: 15px; font-weight: 800;">Prototype #</h2>
                        <div class="details-grid" id="protoPreviewGrid" style="margin-bottom: 15px;">
                            <!-- Info injected here -->
                        </div>
                        <h3 style="font-size: 1.1rem; margin-bottom: 10px; color: var(--text-main);">Box needed:</h3>
                        <div id="protoPreviewBoxes" style="margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px;">
                            <!-- Box counts injected here -->
                        </div>
                        <h3 style="font-size: 1.1rem; margin-bottom: 10px; color: var(--text-main);">Materials Needed</h3>
                        <div id="protoPreviewMaterials" style="margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px;">
                            <!-- Material lengths injected here -->
                        </div>
                        <button class="btn btn-send" onclick="confirmPrototypeSelection()">Select this Prototype</button>
                    </div>
                </div>
            </div>

            <!-- Panel 2: Request -->
            <div class="tab-panel">
                
                <div id="requestPlaceholder" style="text-align: center; color: var(--text-muted); padding: 40px 20px;">
                    <h3>No Prototype Selected</h3>
                    <p style="margin-top: 8px;">Please select a prototype from the Prototype tab first.</p>
                </div>

                <!-- Level 2: Requests List -->
                <div id="view-requests" class="view-section">
                    <h2 id="requestsViewTitle" style="margin-bottom: 16px; font-weight: 800;">Prototype #</h2>
                    <div id="requestsList">
                        <!-- Request rows injected here -->
                    </div>
                </div>

                <!-- Level 3: Request Details -->
                <div id="view-details" class="view-section">
                    <button class="back-btn" onclick="showRequestView('requests')">← Back to List</button>
                    <div class="details-card">
                        <div class="details-grid" id="detailsGrid">
                            <!-- Detail items injected here -->
                        </div>
                        <img id="detailsImage" class="details-image" src="" alt="Request Image" style="display: none;" />
                        <button class="btn btn-send" onclick="sendToMachine()">Send to Machine</button>
                    </div>
                </div>

            </div>

            <!-- Panel 3: Images -->
            <div class="tab-panel">
                <div style="text-align: center; color: var(--text-muted); padding: 40px 20px;">
                    <h3>Images</h3>
                    <p style="margin-top: 8px;">Feature coming soon.</p>
                </div>
            </div>

            <!-- Panel 4: Submit -->
            <div class="tab-panel">
                <div style="text-align: center; color: var(--text-muted); padding: 40px 20px;">
                    <h3>Submit</h3>
                    <p style="margin-top: 8px;">Feature coming soon.</p>
                </div>
            </div>

        </div>
    </div>

    <!-- Worker Select Modal (copied from DCP interactive) -->
    <div id="workerNameModal" class="modal">
        <div>
            <h2 style="text-align: center; margin-bottom: 20px;">Worker Name:</h2>
            <div class="worker-names-container" id="workerNamesContainer" style="max-height: 50vh; overflow-y: auto;">
                <!-- dynamic -->
            </div>
            <button type="button" class="btn btn-secondary btn-full" id="manualEntryBtn" style="margin-top: 15px;">
                Manual Entry
            </button>
            <button type="button" class="btn btn-alert btn-full" id="closeWorkerModal" style="margin-top: 10px;">
                Close
            </button>
        </div>
    </div>

    <!-- Flash Effect -->
    <div class="flash-overlay" id="flashOverlay"></div>

    <!-- Image preview modal -->
    <div id="imgPreviewModal" class="img-preview-modal">
        <button type="button" class="img-preview-close" id="imgPreviewClose">&times;</button>
        <img id="imgPreviewTarget" src="" alt="preview">
    </div>

    <!-- Script imports -->
    <audio id="alert-sound" src="src/alert.mp3" preload="auto"></audio>

    <script src="shisakuTablet.js"></script>
</body>

</html>
