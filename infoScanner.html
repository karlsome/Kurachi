<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Info Scanner</title>
<!--
  infoScanner.html - scan (or type) any SCNA ID / QR and see everything about it:
  masterDB, then every process it went through (Cutting -> SRS -> Kensa) with all stored data.

  Accepts: press box ID (...-B###), SRS ID (...-S###), Kensa ID (...-K###), or an old "品番,収容数,lot" QR.
  Data comes from GET /api/scna-info?code=...   Link a code directly with  infoScanner.html?code=WO-005735-B002
  Server: github.io -> Render, localhost -> localhost:3000, anything else (LAN IP) -> that host on :3000.
          Override with  ?server=https://your-server
  Camera scanning needs https (or localhost); on plain http use the text box.
-->
<style>
  :root {
    --bg: #F4F6FA; --card: #FFFFFF; --subtle: #F6F8FB; --text: #101828; --muted: #667085; --soft: #98A2B3;
    --border: #E4E7EC; --brand: #1F9D6B; --brand-soft: #E7F5EF; --red: #E5484D; --red-soft: #FCEBEC;
    --blue: #2E6FF2; --blue-soft: #EAF1FE; --amber: #E0900E; --amber-soft: #FFF4DF; --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1420; --card: #161E2E; --subtle: #1B2538; --text: #EEF2F8; --muted: #9AA7BC; --soft: #6F7D94;
      --border: #263248; --brand: #34C28B; --brand-soft: #123628; --red: #FF6B70; --red-soft: #3A1B1F;
      --blue: #6D9BFF; --blue-soft: #18284A; --amber: #F2B24A; --amber-soft: #3A2D12;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: env(safe-area-inset-bottom); }
  button, input { font-family: inherit; font-size: 16px; color: inherit; }   /* 16px: no zoom-on-focus on iPhone */

  .wrap { max-width: 1100px; margin: 0 auto; padding: 14px 16px 40px; }
  header { display: flex; align-items: center; gap: 10px; padding: 6px 0 14px; }
  header .logo { width: 38px; height: 38px; border-radius: 11px; background: var(--brand); color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  header .logo svg { width: 22px; height: 22px; stroke: #fff; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  header h1 { font-size: 1.15rem; font-weight: 800; line-height: 1.2; }
  header small { display: block; color: var(--muted); font-weight: 600; font-size: 0.75rem; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
  .search { display: flex; flex-direction: column; gap: 10px; position: sticky; top: 0; z-index: 20; box-shadow: 0 6px 16px -10px rgba(16, 24, 40, .25); }
  .search-row { display: flex; gap: 8px; }
  .search input { flex: 1; min-width: 0; height: 50px; padding: 0 14px; border: 1.5px solid var(--border); border-radius: 12px; background: var(--subtle); outline: none; }
  .search input:focus { border-color: var(--brand); background: var(--card); }
  .btn { height: 50px; padding: 0 16px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--card); font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .btn .lbl { display: inline; }
  @media (max-width: 480px) { .btn.scan .lbl { display: none; } .btn { padding: 0 14px; } }
  .recent { display: flex; gap: 6px; flex-wrap: wrap; }
  .recent:empty { display: none; }
  .chip { border: 1px solid var(--border); background: var(--subtle); border-radius: 999px; padding: 5px 11px; font-size: 0.78rem; font-weight: 700; color: var(--muted); cursor: pointer; }

  #scanBox { display: none; margin-top: 12px; }
  #scanBox.show { display: block; }
  #reader { width: 100%; max-width: 440px; margin: 0 auto; border-radius: 12px; overflow: hidden; background: #000; }
  .scan-hint { text-align: center; color: var(--muted); font-size: 0.85rem; margin-top: 8px; }

  .status { margin-top: 14px; text-align: center; color: var(--muted); font-weight: 600; }
  .status.error { color: var(--red); background: var(--red-soft); border: 1px solid var(--red); border-radius: var(--radius); padding: 14px; }
  .spinner { width: 26px; height: 26px; border: 3px solid var(--border); border-top-color: var(--brand); border-radius: 50%; animation: spin .8s linear infinite; margin: 20px auto 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #result { margin-top: 14px; display: none; }
  .summary { display: flex; flex-direction: column; gap: 10px; }
  .summary .top { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; }
  .summary .top b { font-size: 1.05rem; word-break: break-all; }
  .summary .kv { font-size: 0.85rem; color: var(--muted); }
  .summary .kv span { color: var(--text); font-weight: 700; }
  .kind { background: var(--blue-soft); color: var(--blue); font-weight: 800; border-radius: 999px; padding: 3px 10px; font-size: 0.75rem; }
  .flow { display: flex; gap: 6px; flex-wrap: wrap; }
  .flow a { text-decoration: none; display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--subtle); color: var(--soft); font-weight: 800; font-size: 0.82rem; cursor: pointer; }
  .flow a.has { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }
  .flow a .n { background: var(--card); border-radius: 999px; padding: 0 7px; font-size: 0.75rem; }
  .flow .arrow { color: var(--soft); align-self: center; }

  .proc { margin-top: 18px; scroll-margin-top: 150px; }
  .proc-title { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: 12px 12px 0 0; background: var(--brand); color: #fff; font-weight: 800; font-size: 1.05rem; }
  .proc-title small { margin-left: auto; font-weight: 700; opacity: .9; font-size: 0.78rem; }
  .proc.empty .proc-title { background: var(--soft); }
  .proc-body { border: 1px solid var(--border); border-top: none; border-radius: 0 0 12px 12px; background: var(--card); padding: 6px 12px 12px; }
  .none { color: var(--muted); padding: 12px 2px; font-weight: 600; }
  .group-title { font-size: 0.72rem; font-weight: 800; letter-spacing: .05em; color: var(--muted); text-transform: uppercase; margin: 14px 0 6px; }

  details.doc { border: 1px solid var(--border); border-radius: 12px; margin-top: 8px; background: var(--card); overflow: hidden; }
  details.doc.hit { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-soft); }
  details.doc > summary { list-style: none; cursor: pointer; padding: 11px 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; background: var(--subtle); font-weight: 800; font-size: 0.92rem; }
  details.doc > summary::-webkit-details-marker { display: none; }
  details.doc > summary::before { content: "▸"; color: var(--muted); transition: transform .15s; }
  details.doc[open] > summary::before { transform: rotate(90deg); }
  details.doc > summary .id { word-break: break-all; }
  details.doc > summary .meta { color: var(--muted); font-weight: 600; font-size: 0.78rem; margin-left: auto; }
  .tag { border-radius: 999px; padding: 2px 9px; font-size: 0.7rem; font-weight: 800; background: var(--blue-soft); color: var(--blue); }
  .tag.complete { background: var(--brand-soft); color: var(--brand); }
  .tag.draft { background: var(--amber-soft); color: var(--amber); }
  .tag.voided { background: var(--red-soft); color: var(--red); }
  .doc-body { padding: 4px 12px 12px; }

  .rows { display: grid; grid-template-columns: 1fr; column-gap: 28px; }
  @media (min-width: 860px) { .rows { grid-template-columns: 1fr 1fr; } }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 0.875rem; min-width: 0; }
  .row .k { color: var(--muted); font-weight: 600; flex: 0 0 40%; word-break: break-word; }
  .row .v { font-weight: 700; text-align: right; word-break: break-all; white-space: pre-wrap; flex: 1; min-width: 0; }
  .row.empty .v { color: var(--soft); font-weight: 600; }
  @media (max-width: 420px) { .row { flex-direction: column; gap: 2px; } .row .k, .row .v { flex: none; text-align: left; } }
  .sub { grid-column: 1 / -1; margin: 10px 0 2px; padding: 6px 10px; border-left: 3px solid var(--brand); background: var(--brand-soft); border-radius: 4px; font-weight: 800; font-size: 0.8rem; color: var(--brand); }
  .nest { grid-column: 1 / -1; margin-left: 10px; padding-left: 12px; border-left: 2px solid var(--border); }
  .thumbs { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .thumbs img { width: 84px; height: 84px; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); background: var(--subtle); cursor: zoom-in; }

  #lightbox { position: fixed; inset: 0; z-index: 100; background: rgba(0, 0, 0, .9); display: none; align-items: center; justify-content: center; padding: 16px; }
  #lightbox.show { display: flex; }
  #lightbox img { max-width: 100%; max-height: 100%; border-radius: 10px; }
  #lightbox button { position: absolute; top: max(14px, env(safe-area-inset-top)); right: 18px; background: none; border: none; color: #fff; font-size: 2.4rem; line-height: 1; cursor: pointer; }
  .toolbar { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
  .toolbar .btn { height: 36px; font-size: 0.8rem; padding: 0 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M4 7V5a1 1 0 0 1 1-1h2M4 17v2a1 1 0 0 0 1 1h2M20 7V5a1 1 0 0 0-1-1h-2M20 17v2a1 1 0 0 1-1 1h-2" /><line x1="4" y1="12" x2="20" y2="12" /></svg></div>
    <h1>Info Scanner<small>QR / ID → 全工程の情報 / all process data</small></h1>
  </header>

  <div class="card search">
    <div class="search-row">
      <input id="code" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Box / SRS / Kensa ID  or  QR text">
      <button class="btn primary" id="go" type="button" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><line x1="21" y1="21" x2="16.5" y2="16.5" /></svg><span class="lbl">Search</span></button>
      <button class="btn scan" id="scanBtn" type="button" aria-label="Scan"><svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" /><circle cx="12" cy="13" r="4" /></svg><span class="lbl">Scan</span></button>
    </div>
    <div class="recent" id="recent"></div>
    <div id="scanBox">
      <div id="reader"></div>
      <div class="scan-hint" id="scanHint">QRコードをカメラに向けてください / Point the camera at the QR code</div>
      <div class="toolbar"><button class="btn" id="scanStop" type="button">✕ Close camera</button></div>
    </div>
  </div>

  <div class="status" id="status"></div>
  <div id="result"></div>
</div>

<div id="lightbox"><button type="button" aria-label="close">&times;</button><img alt=""></div>

<script src="html5-qrcode.min.js"></script>
<script>
(function () {
  'use strict';

  // ---------------- server ----------------
  var qs = new URLSearchParams(location.search);
  function pickServer() {
    var o = qs.get('server'); if (o) return o.replace(/\/+$/, '');
    var h = location.hostname;
    if (/github\.io$/i.test(h) || /onrender\.com$/i.test(h)) return 'https://kurachi.onrender.com';
    if (!h || h === 'localhost' || h === '127.0.0.1') return 'http://localhost:3000';
    return 'http://' + h + ':3000';
  }
  var SERVER = pickServer();

  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  // ---------------- recent codes ----------------
  var RECENT_KEY = 'infoScannerRecent';
  function recentList() { try { var r = JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); return Array.isArray(r) ? r : []; } catch (e) { return []; } }
  function addRecent(c) { try { localStorage.setItem(RECENT_KEY, JSON.stringify([c].concat(recentList().filter(function (x) { return x !== c; })).slice(0, 8))); } catch (e) { } renderRecent(); }
  function renderRecent() {
    var host = $('recent'); host.innerHTML = '';
    recentList().forEach(function (c) {
      var b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = c.length > 26 ? c.slice(0, 24) + '…' : c;
      b.onclick = function () { $('code').value = c; search(c); };
      host.appendChild(b);
    });
  }

  // ---------------- rendering ----------------
  var IMG_RE = /^https?:\/\/.+\.(?:jpe?g|png|gif|webp)(?:\?.*)?$/i;
  function isImg(v) { return typeof v === 'string' && (IMG_RE.test(v) || /^https:\/\/firebasestorage\.googleapis\.com\/.+alt=media/i.test(v)); }

  function thumbs(urls) { return '<div class="thumbs">' + urls.map(function (u) { return '<img loading="lazy" src="' + esc(u) + '" data-zoom="' + esc(u) + '" alt="">'; }).join('') + '</div>'; }
  function rowsOf(obj) {
    var html = '';
    Object.keys(obj).filter(function (k) { return k !== '_id'; }).forEach(function (k) {
      var v = obj[k];
      if (v !== null && typeof v === 'object') {
        var arr = Array.isArray(v);
        if (arr && v.length && v.every(isImg)) { html += '<div class="row"><span class="k">' + esc(k) + '</span><span class="v">' + thumbs(v) + '</span></div>'; return; }
        if (arr && !v.some(function (x) { return x !== null && typeof x === 'object'; })) {
          html += '<div class="row' + (v.length ? '' : ' empty') + '"><span class="k">' + esc(k) + '</span><span class="v">' + esc(v.length ? v.join(', ') : '---') + '</span></div>'; return;
        }
        (arr ? v : [v]).forEach(function (x, i) {
          html += '<div class="sub">' + esc(k) + (arr ? ' [' + (i + 1) + ']' : '') + '</div>';
          html += x !== null && typeof x === 'object' ? '<div class="nest"><div class="rows">' + rowsOf(x) + '</div></div>' : '<div class="row"><span class="v">' + esc(String(x)) + '</span></div>';
        });
      } else if (isImg(v)) {
        html += '<div class="row"><span class="k">' + esc(k) + '</span><span class="v">' + thumbs([v]) + '</span></div>';
      } else {
        var txt = v === null || v === undefined ? '' : String(v);
        html += '<div class="row' + (txt === '' ? ' empty' : '') + '"><span class="k">' + esc(k) + '</span><span class="v">' + esc(txt === '' ? '---' : txt) + '</span></div>';
      }
    });
    return html;
  }
  function fmtDate(s) { if (!s) return ''; var d = new Date(s); return isNaN(d) ? String(s) : d.toLocaleString([], { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }); }
  function idOf(d) { return d.kensaId || d.srsId || d.boxId || d.Submit_UID || d.Run_ID || String(d._id || ''); }

  function docCard(doc, hitId, kindLabel, open) {
    var id = idOf(doc), hit = hitId && (doc.kensaId === hitId || doc.srsId === hitId || doc.boxId === hitId);
    var status = doc.status ? '<span class="tag ' + esc(doc.status) + '">' + esc(doc.status) + '</span>' : '';
    var meta = [doc.qtyLabel != null ? doc.qtyLabel + 'pcs' : '', doc.Process_Quantity != null ? doc.Process_Quantity + 'pcs' : '', fmtDate(doc.printedAt || doc.finishedAt || doc.createdAt || doc.Date)].filter(Boolean).join(' · ');
    return '<details class="doc' + (hit ? ' hit' : '') + '"' + (open ? ' open' : '') + '><summary><span class="id">' + esc(kindLabel ? kindLabel + ' ' : '') + esc(id) + '</span>' + status + '<span class="meta">' + esc(meta) + '</span></summary>' +
      '<div class="doc-body"><div class="rows">' + rowsOf(doc) + '</div></div></details>';
  }

  function render(d) {
    var hit = (d.id || '').toUpperCase(), procs = d.processes || [], html = '';
    var counts = procs.map(function (p) { return p.boxes.length + p.records.length; });

    // header: what was scanned + the process flow
    html += '<div class="card summary"><div class="top"><span class="kind">' + esc({ dcp: 'Cutting box', srs: 'SRS label', kensa: 'Kensa label', legacy: 'Lot QR' }[d.kind] || d.kind) + '</span>' +
      '<b>' + esc(d.id || d.code) + '</b></div><div class="top">' +
      '<span class="kv">背番号 <span>' + esc(d.背番号 || '---') + '</span></span><span class="kv">品番 <span>' + esc(d.品番 || '---') + '</span></span>' +
      (d.lot ? '<span class="kv">Lot <span>' + esc(d.lot) + '</span></span>' : '') + '</div>' +
      '<div class="flow"><a class="' + (d.masterDB ? 'has' : '') + '" data-to="p-master">masterDB</a>' +
      procs.map(function (p, i) { return '<span class="arrow">→</span><a class="' + (counts[i] ? 'has' : '') + '" data-to="p-' + p.key + '">' + esc(p.title) + ' <span class="n">' + counts[i] + '</span></a>'; }).join('') + '</div></div>';

    // masterDB
    html += '<div class="proc' + (d.masterDB ? '' : ' empty') + '" id="p-master"><div class="proc-title">masterDB<small>' + esc(d.背番号 || '') + '</small></div><div class="proc-body">';
    if (d.masterDB) {
      var m = Object.assign({}, d.masterDB), img = m.imageURL; delete m.imageURL;
      html += (img ? '<div style="padding:12px 0 4px;text-align:center"><img data-zoom="' + esc(img) + '" src="' + esc(img) + '" alt="" style="max-width:100%;max-height:210px;object-fit:contain;border:1px solid var(--border);border-radius:10px;background:#fff;cursor:zoom-in"></div>' : '') + '<div class="rows">' + rowsOf(m) + '</div>';
    } else html += '<div class="none">masterDB: ---</div>';
    html += '</div></div>';

    // processes in order
    procs.forEach(function (p, i) {
      html += '<div class="proc' + (counts[i] ? '' : ' empty') + '" id="p-' + p.key + '"><div class="proc-title">' + esc(p.title) + '<small>' + p.boxes.length + ' label/box · ' + p.records.length + ' record</small></div><div class="proc-body">';
      if (!counts[i]) html += '<div class="none">この工程の記録はありません / No data for this process</div>';
      var boxName = { cutting: 'Box', srs: 'SRS', kensa: 'Kensa' }[p.key];
      if (p.boxes.length) html += '<div class="group-title">' + (p.key === 'cutting' ? 'Press boxes / 箱' : 'Labels / ラベル') + '</div>' + p.boxes.map(function (b) { return docCard(b, hit, '', p.boxes.length === 1); }).join('');
      if (p.records.length) html += '<div class="group-title">Submitted records / 提出記録</div>' + p.records.map(function (r) { return docCard(r, hit, '', false); }).join('');
      html += '</div></div>';
    });
    html += '<div class="toolbar"><button class="btn" id="expandAll" type="button">Expand all</button><button class="btn" id="collapseAll" type="button">Collapse all</button></div>';

    var host = $('result'); host.innerHTML = html; host.style.display = 'block';
    host.querySelectorAll('[data-to]').forEach(function (a) { a.onclick = function () { var t = $(a.getAttribute('data-to')); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); }; });
    host.querySelectorAll('[data-zoom]').forEach(function (im) { im.onclick = function () { $('lightbox').querySelector('img').src = im.getAttribute('data-zoom'); $('lightbox').classList.add('show'); }; });
    $('expandAll').onclick = function () { host.querySelectorAll('details.doc').forEach(function (x) { x.open = true; }); };
    $('collapseAll').onclick = function () { host.querySelectorAll('details.doc').forEach(function (x) { x.open = false; }); };
  }
  $('lightbox').onclick = function () { this.classList.remove('show'); };

  // ---------------- search ----------------
  var busy = 0;
  async function search(code) {
    code = String(code || $('code').value || '').trim(); if (!code) return;
    var ticket = ++busy;
    stopScan();
    $('result').style.display = 'none';
    $('status').className = 'status'; $('status').innerHTML = '<div class="spinner"></div>読み込み中… / Loading…';
    try {
      var r = await fetch(SERVER + '/api/scna-info?code=' + encodeURIComponent(code));
      var j = await r.json().catch(function () { return {}; });
      if (ticket !== busy) return;
      if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
      $('status').textContent = ''; $('status').className = 'status';
      addRecent(code); render(j);
      try { history.replaceState(null, '', '?code=' + encodeURIComponent(code) + (qs.get('server') ? '&server=' + encodeURIComponent(qs.get('server')) : '')); } catch (e) { }
      window.scrollTo({ top: 0 });
    } catch (e) {
      if (ticket !== busy) return;
      $('status').className = 'status error'; $('status').textContent = '⚠ ' + (e.message === 'Failed to fetch' ? 'Cannot reach the server (' + SERVER + ')' : e.message);
    }
  }
  $('go').onclick = function () { search(); };
  $('code').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); $('code').blur(); search(); } });

  // ---------------- camera ----------------
  var scanner = null;
  function stopScan() {
    $('scanBox').classList.remove('show');
    if (!scanner) return Promise.resolve();
    var s = scanner; scanner = null;
    return s.stop().then(function () { return s.clear(); }).catch(function () { });
  }
  $('scanStop').onclick = stopScan;
  $('scanBtn').onclick = function () {
    if (scanner) return stopScan();
    if (typeof Html5Qrcode === 'undefined') { $('status').className = 'status error'; $('status').textContent = '⚠ Scanner library not loaded'; return; }
    if (!window.isSecureContext) { $('status').className = 'status error'; $('status').textContent = '⚠ Camera needs https (or localhost). Type the ID instead.'; return; }
    $('status').textContent = ''; $('status').className = 'status';
    $('scanBox').classList.add('show');
    scanner = new Html5Qrcode('reader');
    var done = false;
    scanner.start({ facingMode: 'environment' }, { fps: 12, qrbox: function (w, h) { var m = Math.floor(Math.min(w, h) * 0.8); return { width: m, height: m }; } }, function (text) {
      if (done) return; done = true;
      $('code').value = text; search(text);
    }, function () { }).catch(function (e) {
      scanner = null; $('scanBox').classList.remove('show');
      $('status').className = 'status error'; $('status').textContent = '⚠ Camera: ' + (e && e.message ? e.message : e);
    });
  };

  // ---------------- start ----------------
  renderRecent();
  var first = qs.get('code');
  if (first) { $('code').value = first; search(first); }
  else { $('code').focus(); }
})();
</script>
</body>
</html>
